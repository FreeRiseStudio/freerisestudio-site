<style>
@font-face {
  font-family: "Bricolage Grotesque";
  src: url("/fonts/bricolage-700.woff2") format("woff2");
  font-weight: 700;
  font-display: swap;
}
:root {
  --ink: #0A0A0A;
  --paper: #F2EEE4;
  --gold: #F2B705;
  --gold-light: #FFD75E;
  --muted: #B9B2A2;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  isolation: isolate;
  display: flex;
  flex-direction: column;
}
.bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}
/* soft vignette so text over the mountains stays crisp */
.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 45%;
  background: linear-gradient(to bottom, rgba(10,10,10,0), rgba(10,10,10,.4));
  z-index: -1;
  pointer-events: none;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 16px 24px;
  gap: 0;
}
h1 { margin: 0; line-height: 0; }
.lockup {
  display: block;
  width: min(880px, 94vw);
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
}

.tagline {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 52px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: clamp(20px, 4vh, 40px) 0 0;
}
.tagline em { font-style: normal; color: var(--gold); }
.about {
  max-width: 34em;
  margin: 14px auto 0;
  font-size: clamp(15px, 1.6vw, 18px);
  line-height: 1.55;
  color: var(--muted);
}

.soon-tab {
  display: inline-block;
  margin-top: 28px;
  padding: 9px 20px 8px;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(14px, 1.5vw, 17px);
  letter-spacing: .32em;
  text-indent: .32em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--gold);
  border: 2px solid var(--paper);
  box-shadow: 0 6px 0 rgba(0,0,0,.35);
  transform: rotate(-2deg);
}

.socials {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin: 32px 0 0;
  padding: 0;
}
.socials a, .socials .soon {
  position: relative;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(242,238,228,.07);
  border: 1px solid rgba(242,238,228,.18);
  color: var(--paper);
  transition: transform .35s cubic-bezier(.2,.9,.25,1.2), background-color .25s, color .25s, border-color .25s;
}
.socials svg { width: 20px; height: 20px; fill: currentColor; }
.socials a:hover, .socials a:focus-visible {
  transform: translateY(-4px) rotate(-4deg);
  background: var(--gold);
  border-color: var(--gold);
  color: var(--ink);
  outline: none;
}
.socials .soon { opacity: .45; cursor: default; }
.socials .soon::after {
  content: "soon";
  position: absolute;
  bottom: -8px;
  font: 700 9px/1 var(--display);
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 3px 5px;
  background: var(--paper);
  color: var(--ink);
  border-radius: 3px;
}

.contact {
  margin: 26px 0 0;
  font-size: 15px;
  color: var(--muted);
}
.contact a {
  color: var(--paper);
  text-decoration: none;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 1px;
  transition: color .25s;
}
.contact a:hover, .contact a:focus-visible { color: var(--gold-light); }

footer {
  padding: 16px 16px 20px;
  text-align: center;
  font-size: 13px;
  color: rgba(242,238,228,.45);
}

/* ---------- motion: the approved splash intro, settling into a living scene ---------- */
.bg .rays { transform-box: view-box; transform-origin: 960px 640px; animation: fade 1.6s ease-out both, sway 18s ease-in-out infinite alternate; }
.bg .glow { transform-box: fill-box; transform-origin: center; animation: glow-in 2s ease-out both, breathe 7s 2s ease-in-out infinite alternate; }
.bg .rg   { animation: rg-in 1.4s cubic-bezier(.2,.8,.2,1) both; }
.bg .rg0 { animation-delay: .00s } .bg .rg1 { animation-delay: .12s }
.bg .rg2 { animation-delay: .24s } .bg .rg3 { animation-delay: .36s }
.bg .sp   { animation: fade 1.5s .6s both, drift 9s ease-in-out infinite alternate; }
.lockup .fe { animation: fe-rise 1.5s cubic-bezier(.16,.8,.24,1) .45s both; }
.lockup .l  { animation: l-in .55s cubic-bezier(.2,.9,.25,1.15) both; }
.lockup .l0 { animation-delay: 1.05s } .lockup .l1 { animation-delay: 1.11s }
.lockup .l2 { animation-delay: 1.17s } .lockup .l3 { animation-delay: 1.23s }
.lockup .l4, .lockup .l5, .lockup .l6, .lockup .l7 { animation-name: r-in; animation-duration: .7s; }
.lockup .l4 { animation-delay: 1.45s } .lockup .l5 { animation-delay: 1.53s }
.lockup .l6 { animation-delay: 1.61s } .lockup .l7 { animation-delay: 1.69s }
.lockup .tab { animation: tab-in .5s cubic-bezier(.2,.9,.25,1.2) 2.1s both; }
.reveal { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
.d1 { animation-delay: 2.3s } .d2 { animation-delay: 2.45s } .d3 { animation-delay: 2.6s }
.d4 { animation-delay: 2.75s } .d5 { animation-delay: 2.9s } .d6 { animation-delay: 3.1s }
.soon-tab.reveal { animation-name: tab-drop; }

@keyframes sway { from { transform: rotate(-4deg) } to { transform: rotate(4deg) } }
@keyframes rg-in { from { opacity: 0; transform: translateY(120px) } to { opacity: 1; transform: none } }
@keyframes fe-rise { from { transform: translate(-80px,360px) rotate(-12deg); opacity: 0 } 25% { opacity: 1 } to { transform: none; opacity: 1 } }
@keyframes glow-in { from { opacity: 0; transform: scale(.55) } to { opacity: 1; transform: none } }
@keyframes breathe { from { opacity: 1 } to { opacity: .7 } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes drift { from { transform: translateY(40px) } to { transform: translateY(-40px) } }
@keyframes l-in { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
@keyframes r-in { from { opacity: 0; transform: translateY(120px) } to { opacity: 1; transform: none } }
@keyframes tab-in { from { opacity: 0; transform: translateX(-40px) } to { opacity: 1; transform: none } }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes tab-drop { from { opacity: 0; transform: translateY(-14px) rotate(-8deg) } to { opacity: 1; transform: rotate(-2deg) } }

/* once the lockup has landed, let the feather float gently */
.lockup .float { transform-box: fill-box; transform-origin: 50% 90%; animation: float 6s 2.2s ease-in-out infinite alternate; }
@keyframes float { from { transform: translateY(0) rotate(0) } to { transform: translateY(-10px) rotate(2deg) } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 520px) {
  main { padding-top: 32px; }
  .socials { gap: 10px; }
}
</style>
